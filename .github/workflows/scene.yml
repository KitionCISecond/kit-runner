name: scene

# Runs Kition's kit CI (KitionAI/kition .github/workflows/kit-ci.yml at main) for one commit of
# the public repository KitionAI/kition-scene. Written by Kition's scripts/kit-ci-runner-repo.mjs;
# started by Kition's scripts/kit-ci.sh (gh workflow run scene.yml -f sha=<commit>), which finds
# the run by its name. A newer dispatch for scene cancels the older one.

on:
  workflow_dispatch:
    inputs:
      sha:
        description: The commit of KitionAI/kition-scene to test (the full 40-character SHA)
        required: true
        type: string
      ref_note:
        description: A note for humans (where the commit comes from); the run does not read it
        required: false
        type: string
        default: ''

run-name: scene ${{ inputs.sha }}

permissions:
  contents: read

concurrency:
  group: scene
  cancel-in-progress: true

jobs:
  ci:
    uses: KitionAI/kition/.github/workflows/kit-ci.yml@main
    with:
      kit: scene
      repository: KitionAI/kition-scene
      ref: ${{ inputs.sha }}
